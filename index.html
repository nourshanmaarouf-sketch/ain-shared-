<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c075"/><stop offset="1" stop-color="#a87d2c"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e9b6"/><stop offset=".55" stop-color="#d9b45f"/><stop offset="1" stop-color="#a47b2d"/></linearGradient></defs></svg>
<header>

<script>
const $=s=>document.querySelector(s);

let D=null,S=null,view='home',q='',sel=null,L=null,P=30,ty='',SH=null;const PL={7:'أسبوع',30:'شهر',365:'سنة'};
D={u:[],i:[],c:[],f:[]};let AL={},GR='retail',MG={m:null,s:[],r:'retail',q:''},IM=-1,SM=-1;let TRs='',TN='',EDI=null,RT=0;let ready=false,SHP=[],OWN=null,PRV={},ADMU=null,LG=false;const save=()=>{};
{const m=location.hash.match(/^#s([A-Za-z0-9]+)$/);if(m)SH=m[1]}
const me=()=>D.u.find(u=>u.id===S);
const RL={retail:'تاجر تجزئة',wholesale:'تاجر جملة'};
const TY=['مواد أساسية','خضار وفواكه','ألبان وأجبان','لحوم ودواجن','معلبات','مشروبات','منظفات','أخرى'];
const fd=t=>{const d=new Date(t);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')};
const MN=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const fe=t=>{const m=String(t||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?(+m[3])+' '+MN[+m[2]-1]+' '+m[1]:String(t||'')};
const dsel=(v)=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/),y0=new Date().getFullYear(),d=m?+m[3]:0,mo=m?+m[2]:0,y=m?+m[1]:0,ys=[];for(let k=y0;k<=y0+10;k++)ys.push(k);if(y&&!ys.includes(y)){ys.push(y);ys.sort((a,b)=>a-b)}
const o=(arr,sel,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option value="${x[0]}"${x[0]==sel?' selected':''}>${x[1]}</option>`).join('');
return `<div class="ds"><select id="exd" aria-label="اليوم" style="flex:.85">${o(Array.from({length:31},(_,i)=>[i+1,i+1]),d,'اليوم')}</select><select id="exm" aria-label="الشهر" style="flex:2.5">${o(MN.map((n,i)=>[i+1,n]),mo,'الشهر')}</select><select id="exy" aria-label="السنة" style="flex:1.3">${o(ys.map(k=>[k,k]),y,'السنة')}</select></div>`};

function out(){if(confirm('هل تريد تسجيل الخروج؟')){FB.signOut(FB.auth).catch(()=>{})}}

function lst(){const g=groups().filter(x=>(!ty||x.type==ty)&&hit(x.name+' '+(x.kind||'')+' '+(x.pack||'')+' '+x.l.map(i=>i.barcode||'').join(' '),q));
if(!g.length)return '<div class="card empty"><p class="mu">لا توجد مواد مطابقة حالياً.</p></div>';
return g.map(x=>{const p=x.l.map(i=>i.price);return `<div class="card row" data-k="${e(x.k)}" onclick="sel=this.dataset.k;render()"><div><b>${e(x.name)}${x.kind?' – '+e(x.kind):''}</b><div class="mu">${e(x.pack||'')} · ${x.l.length} منشأة</div></div><div style="text-align:left"><div class="mu">الأدنى <span class="pr">${fp(Math.min(...p))}</span></div><div class="mu">الأعلى <span class="pr">${fp(Math.max(...p))}</span></div></div></div>`}).join('')}
let UL=null,SO='p';try{const v=JSON.parse(sessionStorage.getItem('ain_ul')||'null');if(v&&isFinite(v.lat)&&isFinite(v.lng))UL=v}catch(x){}
const hv=(a,b)=>{const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,t=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(t))};
const fk=d=>d<1?Math.round(d*1000)+' م':d.toFixed(1)+' كم';
const dOf=s=>UL&&s&&s.lat!=null&&s.lng!=null?hv(UL,s):null;
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'اليوم':d==1?'أمس':d<=10?'منذ '+d+' أيام':'منذ '+d+' يوماً'};
function myLoc(){toast('جارٍ تحديد موقعك…');if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع');
navigator.geolocation.getCurrentPosition(p=>{UL={lat:p.coords.latitude,lng:p.coords.longitude};try{sessionStorage.setItem('ain_ul',JSON.stringify(UL))}catch(x){}render()},()=>toast('تعذّر تحديد الموقع، اسمح للمتصفح بالوصول إليه'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function clrLoc(){UL=null;try{sessionStorage.removeItem('ain_ul')}catch(x){}render()}
function nearBox(g){
if(!UL)return `<div class="card"><h2 style="font-size:17px">الأقرب والأرخص لك</h2><p class="mu">حدّد موقعك لنعرض أقرب محل وأرخص محل وأفضل خيار يجمع بينهما. موقعك يبقى على جهازك ولا يُرسل لأي جهة.</p><button class="btn s" type="button" onclick="myLoc()">${IC.dir}حدّد موقعي</button></div>`;
const r=g.l.map(i=>{const s=D.u.find(x=>x.id==i.uid);return{i,s,d:dOf(s)}}).filter(o=>o.d!=null);
